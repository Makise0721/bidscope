x-production-environment: &production-environment
  BIDSCOPE_APP_MODE: production
  BIDSCOPE_ADMIN_TOKEN: ${BIDSCOPE_ADMIN_TOKEN:?set BIDSCOPE_ADMIN_TOKEN to a generated production token}
  BIDSCOPE_ALLOWED_ORIGINS: ${BIDSCOPE_ALLOWED_ORIGINS:?set BIDSCOPE_ALLOWED_ORIGINS to a JSON origin list}
  BIDSCOPE_TRUSTED_HOSTS: ${BIDSCOPE_TRUSTED_HOSTS:?set BIDSCOPE_TRUSTED_HOSTS to a JSON host list}
  BIDSCOPE_EXTERNAL_SCHEME: ${BIDSCOPE_EXTERNAL_SCHEME:?set BIDSCOPE_EXTERNAL_SCHEME=https}
  BIDSCOPE_OBJECT_STORE_TYPE: s3
  BIDSCOPE_S3_ENDPOINT: http://minio:9000
  BIDSCOPE_S3_REGION: ${BIDSCOPE_S3_REGION:-us-east-1}
  BIDSCOPE_S3_BUCKET: ${BIDSCOPE_S3_BUCKET:?set BIDSCOPE_S3_BUCKET}
  BIDSCOPE_S3_ACCESS_KEY: ${BIDSCOPE_S3_ACCESS_KEY:?set BIDSCOPE_S3_ACCESS_KEY}
  BIDSCOPE_S3_SECRET_KEY: ${BIDSCOPE_S3_SECRET_KEY:?set BIDSCOPE_S3_SECRET_KEY}

x-minio-environment: &minio-environment
  MINIO_ROOT_USER: ${BIDSCOPE_S3_ACCESS_KEY:?set BIDSCOPE_S3_ACCESS_KEY}
  MINIO_ROOT_PASSWORD: ${BIDSCOPE_S3_SECRET_KEY:?set BIDSCOPE_S3_SECRET_KEY}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bidscope
      POSTGRES_USER: bidscope
      POSTGRES_PASSWORD: bidscope
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidscope -d bidscope"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      <<: *minio-environment
    ports:
      - "19000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  # One-shot bucket bootstrap: creates the configured S3 bucket before the API
  # or scheduler start, so neither has to create it on first request.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-environment
      BIDSCOPE_S3_BUCKET: ${BIDSCOPE_S3_BUCKET:?set BIDSCOPE_S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set bidscope http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing bidscope/$${BIDSCOPE_S3_BUCKET}
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bidscope", "api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *production-environment
      BIDSCOPE_DATABASE_URL: postgresql+asyncpg://bidscope:bidscope@postgres:5432/bidscope
      BIDSCOPE_CHECKPOINT_DATABASE_URL: postgresql+psycopg://bidscope:bidscope@postgres:5432/bidscope
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bidscope", "scheduler", "start"]
    environment:
      <<: *production-environment
      BIDSCOPE_DATABASE_URL: postgresql+asyncpg://bidscope:bidscope@postgres:5432/bidscope
      BIDSCOPE_CHECKPOINT_DATABASE_URL: postgresql+psycopg://bidscope:bidscope@postgres:5432/bidscope
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
