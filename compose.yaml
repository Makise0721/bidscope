services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: bidscope
      POSTGRES_USER: bidscope
      POSTGRES_PASSWORD: bidscope
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidscope -d bidscope"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bidscope", "api", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      BIDSCOPE_APP_MODE: demo
      BIDSCOPE_DATABASE_URL: postgresql+asyncpg://bidscope:bidscope@postgres:5432/bidscope
      BIDSCOPE_CHECKPOINT_DATABASE_URL: postgresql+psycopg://bidscope:bidscope@postgres:5432/bidscope
      BIDSCOPE_OBJECT_STORE_TYPE: s3
      BIDSCOPE_S3_ENDPOINT: http://minio:9000
      BIDSCOPE_S3_BUCKET: bidscope
      BIDSCOPE_S3_ACCESS_KEY: minio
      BIDSCOPE_S3_SECRET_KEY: minioadmin
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bidscope", "scheduler", "start"]
    environment:
      BIDSCOPE_APP_MODE: production
      BIDSCOPE_DATABASE_URL: postgresql+asyncpg://bidscope:bidscope@postgres:5432/bidscope
      BIDSCOPE_CHECKPOINT_DATABASE_URL: postgresql+psycopg://bidscope:bidscope@postgres:5432/bidscope
      BIDSCOPE_OBJECT_STORE_TYPE: s3
      BIDSCOPE_S3_ENDPOINT: http://minio:9000
      BIDSCOPE_S3_BUCKET: bidscope
      BIDSCOPE_S3_ACCESS_KEY: minio
      BIDSCOPE_S3_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
