x-production-environment: &production-environment
  BIDSCOPE_APP_MODE: production
  BIDSCOPE_ADMIN_TOKEN: ${BIDSCOPE_ADMIN_TOKEN:?set BIDSCOPE_ADMIN_TOKEN to a generated production token}
  BIDSCOPE_ALLOWED_ORIGINS: ${BIDSCOPE_ALLOWED_ORIGINS:?set BIDSCOPE_ALLOWED_ORIGINS to a JSON origin list}
  BIDSCOPE_TRUSTED_HOSTS: ${BIDSCOPE_TRUSTED_HOSTS:?set BIDSCOPE_TRUSTED_HOSTS to a JSON host list}
  BIDSCOPE_EXTERNAL_SCHEME: ${BIDSCOPE_EXTERNAL_SCHEME:?set BIDSCOPE_EXTERNAL_SCHEME=https}
  BIDSCOPE_OBJECT_STORE_TYPE: s3
  BIDSCOPE_REAL_MODEL_ENABLED: ${BIDSCOPE_REAL_MODEL_ENABLED:-false}
  BIDSCOPE_MODEL_API_KEY: ${BIDSCOPE_MODEL_API_KEY-}
  BIDSCOPE_S3_ENDPOINT: ${BIDSCOPE_S3_ENDPOINT:?set BIDSCOPE_S3_ENDPOINT to the S3 endpoint}
  BIDSCOPE_S3_REGION: ${BIDSCOPE_S3_REGION:?set BIDSCOPE_S3_REGION to the S3 region}
  BIDSCOPE_S3_BUCKET: ${BIDSCOPE_S3_BUCKET:?set BIDSCOPE_S3_BUCKET to the S3 bucket name}
  BIDSCOPE_S3_PREFIX: ${BIDSCOPE_S3_PREFIX:?set BIDSCOPE_S3_PREFIX to the S3 key prefix}
  BIDSCOPE_S3_ACCESS_KEY: ${BIDSCOPE_S3_ACCESS_KEY:?set BIDSCOPE_S3_ACCESS_KEY to the S3 access key}
  BIDSCOPE_S3_SECRET_KEY: ${BIDSCOPE_S3_SECRET_KEY:?set BIDSCOPE_S3_SECRET_KEY to the S3 secret key}

x-minio-environment: &minio-environment
  MINIO_ROOT_USER: ${BIDSCOPE_S3_ACCESS_KEY:?set BIDSCOPE_S3_ACCESS_KEY}
  MINIO_ROOT_PASSWORD: ${BIDSCOPE_S3_SECRET_KEY:?set BIDSCOPE_S3_SECRET_KEY}

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${BIDSCOPE_POSTGRES_DB:?set BIDSCOPE_POSTGRES_DB}
  POSTGRES_USER: ${BIDSCOPE_POSTGRES_USER:?set BIDSCOPE_POSTGRES_USER}
  POSTGRES_PASSWORD: ${BIDSCOPE_POSTGRES_PASSWORD:?set BIDSCOPE_POSTGRES_PASSWORD}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      <<: *postgres-environment
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: server /data --console-address ":9001"
    environment:
      <<: *minio-environment
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - minio_data:/data

  # One-shot bucket bootstrap: creates the configured S3 bucket before the API
  # or scheduler start, so neither has to create it on first request.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-environment
      BIDSCOPE_S3_BUCKET: ${BIDSCOPE_S3_BUCKET:?set BIDSCOPE_S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set bidscope http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing bidscope/$${BIDSCOPE_S3_BUCKET}
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bidscope", "api", "serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *production-environment
      BIDSCOPE_DATABASE_URL: ${BIDSCOPE_DATABASE_URL:?set BIDSCOPE_DATABASE_URL to a pre-encoded PostgreSQL application DSN}
      BIDSCOPE_CHECKPOINT_DATABASE_URL: ${BIDSCOPE_CHECKPOINT_DATABASE_URL:?set BIDSCOPE_CHECKPOINT_DATABASE_URL to a pre-encoded PostgreSQL checkpoint DSN}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["bidscope", "scheduler", "start"]
    environment:
      <<: *production-environment
      BIDSCOPE_DATABASE_URL: ${BIDSCOPE_DATABASE_URL:?set BIDSCOPE_DATABASE_URL to a pre-encoded PostgreSQL application DSN}
      BIDSCOPE_CHECKPOINT_DATABASE_URL: ${BIDSCOPE_CHECKPOINT_DATABASE_URL:?set BIDSCOPE_CHECKPOINT_DATABASE_URL to a pre-encoded PostgreSQL checkpoint DSN}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      disable: true

volumes:
  postgres_data:
  minio_data:
