[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "bidscope"
version = "0.1.0"
description = "Evidence-first bidding intelligence agent"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=0.3,<1",
    "langgraph>=0.2.60,<1",
    "langgraph-checkpoint-postgres>=2,<3",
    "pgvector>=0.3.6,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "pydantic-settings>=2.6,<3",
    "python-docx>=1.1.2,<2",
    "rapidfuzz>=3.10,<4",
    "selectolax>=0.3.26,<1",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "sse-starlette>=2.1,<3",
    "typer>=0.15,<1",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
bidscope = "bidscope.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "pytest-cov>=6,<7",
    "ruff>=0.8,<1",
    "testcontainers>=4.9,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/bidscope"]

[tool.hatch.build.targets.wheel.force-include]
"backend/src/bidscope/evaluation/corpus/synthetic-notices-v1.jsonl" = "bidscope/evaluation/corpus/synthetic-notices-v1.jsonl"
"backend/src/bidscope/evaluation/data/claims-v1.jsonl" = "bidscope/evaluation/data/claims-v1.jsonl"
"backend/src/bidscope/evaluation/data/dedup-v1.jsonl" = "bidscope/evaluation/data/dedup-v1.jsonl"
"backend/src/bidscope/evaluation/data/e2e-v1.jsonl" = "bidscope/evaluation/data/e2e-v1.jsonl"
"backend/src/bidscope/evaluation/data/intent-v1.jsonl" = "bidscope/evaluation/data/intent-v1.jsonl"
"backend/src/bidscope/evaluation/data/retrieval-v1.jsonl" = "bidscope/evaluation/data/retrieval-v1.jsonl"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["backend/tests"]
pythonpath = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Alembic auto-generated migration scripts follow a stable template that
# predates stricter typing-import and union-syntax conventions.
"migrations/versions/*.py" = ["UP035", "UP007", "I001", "E501"]
# FastAPI Dependency Injection uses ``Depends(...)`` as a parameter default
# throughout the route handlers; B008 flags this general pattern.
"backend/src/bidscope/api/routes/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend/src"
explicit_package_bases = true
packages = ["bidscope"]
