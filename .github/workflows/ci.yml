name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --- Lint ---------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check backend scripts

  # --- Type check ---------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run mypy backend/src/bidscope

  # --- Unit + contract tests ---------------------------------------------
  unit:
    name: Unit & contract tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit, contract & security tests
        run: uv run pytest backend/tests/unit backend/tests/contract backend/tests/security -q

  # --- Integration tests --------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bidscope_test
          POSTGRES_USER: bidscope
          POSTGRES_PASSWORD: bidscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidscope -d bidscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BIDSCOPE_DATABASE_URL: postgresql+asyncpg://bidscope:bidscope@localhost:5432/bidscope_test
      BIDSCOPE_CHECKPOINT_DATABASE_URL: postgresql+psycopg://bidscope:bidscope@localhost:5432/bidscope_test
      BIDSCOPE_APP_MODE: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Create checkpoint tables
        run: uv run bidscope checkpoints setup

      - name: Run integration tests
        run: uv run pytest backend/tests/integration -q

  # --- P1 runtime gate -----------------------------------------------------
  p1_runtime:
    name: P1 runtime readiness and recovery contracts
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run P1 runtime contracts
        run: >-
          uv run pytest
          backend/tests/unit/test_observability.py
          backend/tests/unit/test_readiness.py
          backend/tests/unit/test_backup.py
          backend/tests/unit/test_backup_restore.py
          backend/tests/unit/api/test_run_cancellation.py
          backend/tests/unit/subscriptions/test_scheduler.py
          backend/tests/unit/deployment/test_deployment_contract.py -q

      - name: Record stage gate
        run: printf '{"stage":"P1-runtime","passed":true}\n' > p1-runtime-gate.json

      - name: Upload stage gate
        uses: actions/upload-artifact@v4
        with:
          name: p1-runtime-gate
          path: p1-runtime-gate.json

  eval:
    name: Deterministic evaluation
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run deterministic evaluation
        run: uv run --offline bidscope eval run --mode deterministic --output eval/results/deterministic.json

      - name: Upload evaluation result
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-eval-result
          path: eval/results/deterministic.json
          retention-days: 30

  # --- Docker build -------------------------------------------------------
  docker:
    name: Docker build & smoke
    runs-on: ubuntu-latest
    needs: [integration, eval]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bidscope_test
          POSTGRES_USER: bidscope
          POSTGRES_PASSWORD: bidscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidscope -d bidscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bidscope:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm bidscope:ci bidscope --help

      - name: Initialize schema and checkpoints in the image
        run: |
          # The image installs Alembic and the BidScope CLI system-wide. Run
          # the direct binaries as UID 1000; `uv run` would try to create
          # /app/.venv, which is intentionally not writable in the image.
          docker run --rm --network host \
            -e BIDSCOPE_DATABASE_URL=postgresql+asyncpg://bidscope:bidscope@localhost:5432/bidscope_test \
            -e BIDSCOPE_CHECKPOINT_DATABASE_URL=postgresql+psycopg://bidscope:bidscope@localhost:5432/bidscope_test \
            bidscope:ci alembic upgrade head
          docker run --rm --network host \
            -e BIDSCOPE_DATABASE_URL=postgresql+asyncpg://bidscope:bidscope@localhost:5432/bidscope_test \
            -e BIDSCOPE_CHECKPOINT_DATABASE_URL=postgresql+psycopg://bidscope:bidscope@localhost:5432/bidscope_test \
            bidscope:ci bidscope checkpoints setup

      - name: Smoke-test the API server in the image
        run: |
          # Start the API server detached using the canonical serve command,
          # then poll /readyz. The host network lets the container reach the
          # runner's postgres service.
          docker run -d --name bidscope-smoke --network host \
            -e BIDSCOPE_APP_MODE=test \
            -e BIDSCOPE_DATABASE_URL=postgresql+asyncpg://bidscope:bidscope@localhost:5432/bidscope_test \
            -e BIDSCOPE_CHECKPOINT_DATABASE_URL=postgresql+psycopg://bidscope:bidscope@localhost:5432/bidscope_test \
            bidscope:ci bidscope api serve --host 127.0.0.1 --port 8000
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/readyz >/dev/null; then
              echo "readyz OK"
              docker rm -f bidscope-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become healthy"
          docker logs bidscope-smoke
          docker rm -f bidscope-smoke >/dev/null
          exit 1

  # --- Clean-host recovery gate -------------------------------------------
  recovery:
    name: Backup clean-host recovery drill
    runs-on: ubuntu-latest
    needs: [docker, e2e]
    steps:
      - uses: actions/checkout@v4

      - name: Run clean-host recovery drill
        env:
          # The script uses deterministic synthetic snapshots and the fake
          # model.  External backup replication stays disabled unless an
          # operator explicitly supplies its separate credentials.
          BIDSCOPE_BACKUP_S3_ENABLED: "false"
          BIDSCOPE_RECOVERY_EVIDENCE_PATH: recovery-evidence.json
        run: bash scripts/backup_restore_smoke.sh

      - name: Upload recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backup-recovery-evidence
          path: recovery-evidence.json
          if-no-files-found: error
          retention-days: 30

  # --- Web frontend tests + build ----------------------------------------
  web:
    name: Web frontend tests & build
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm --prefix web ci

      - name: Run web tests
        run: npm run test:web -- --run

      - name: Build web (tsc + vite + copy static)
        run: npm run build:web

  # --- End-to-end tests ---------------------------------------------------
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [integration, web]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          # The GHA services postgres only creates POSTGRES_DB; bidscope_e2e is
          # provisioned in a step below via the init script.
          POSTGRES_DB: bidscope_test
          POSTGRES_USER: bidscope
          POSTGRES_PASSWORD: bidscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidscope -d bidscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BIDSCOPE_TEST_CONTROL_TOKEN: e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@v4

      - name: Provision bidscope_e2e database
        env:
          PGPASSWORD: bidscope
        # Idempotent: re-runs of this job (or a leftover DB) must not fail the
        # CREATE. Postgres has no CREATE DATABASE IF NOT EXISTS, so gate on a
        # pg_database probe via \gexec (same pattern as the init script).
        run: |
          psql -h localhost -U bidscope -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          SELECT 'CREATE DATABASE bidscope_e2e'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'bidscope_e2e')\gexec
          SQL

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm --prefix web ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
