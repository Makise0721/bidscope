name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --- Lint ---------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff
        run: uv run ruff check backend scripts

  # --- Type check ---------------------------------------------------------
  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run mypy
        run: uv run mypy backend/src/bidscope

  # --- Unit + contract tests ---------------------------------------------
  unit:
    name: Unit & contract tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run unit & contract tests
        run: uv run pytest backend/tests/unit backend/tests/contract -q

  # --- Integration tests --------------------------------------------------
  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [unit]

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: bidscope_test
          POSTGRES_USER: bidscope
          POSTGRES_PASSWORD: bidscope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bidscope -d bidscope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BIDSCOPE_DATABASE_URL: postgresql+asyncpg://bidscope:bidscope@localhost:5432/bidscope_test
      BIDSCOPE_CHECKPOINT_DATABASE_URL: postgresql://bidscope:bidscope@localhost:5432/bidscope_test
      BIDSCOPE_APP_MODE: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Create checkpoint tables
        run: uv run bidscope checkpoints setup

      - name: Run integration tests
        run: uv run pytest backend/tests/integration -q

  # --- Deterministic evaluation ------------------------------------------
  eval:
    name: Deterministic evaluation
    runs-on: ubuntu-latest
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: latest

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run deterministic evaluation
        run: uv run --offline bidscope eval run --mode deterministic --output eval/results/deterministic.json

      - name: Upload evaluation result
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-eval-result
          path: eval/results/deterministic.json
          retention-days: 30

  # --- Docker build -------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [integration, eval]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: bidscope:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm bidscope:ci --help

  # --- Web frontend tests -------------------------------------------------
  web:
    name: Web frontend tests
    runs-on: ubuntu-latest
    needs: [unit]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        run: npm run test:unit
